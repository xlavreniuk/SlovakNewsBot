# ==============================================================================
# Universal News Bot Configuration
# ==============================================================================
# This configuration defines which country to monitor, what type of news to find,
# how to filter and score them, and how to format the output for Telegram.
# To adapt this bot for another country or style, simply adjust the values below!

# 1. Target Region and Topic
country: "Slovakia"
target_city: "Bratislava"
source_language: "Slovak"
timezone: "Europe/Bratislava"  # Local time zone given to the AI so it can tell "today" from "yesterday"
content_theme: "interesting, engaging, notable, or fresh local news, events, festivals, accidents, transport, city life, crime blotters, weather warnings, culture, and happenings occurring EXCLUSIVELY in BRATISLAVA (and Bratislava boroughs: Petržalka, Ružinov, Staré Mesto, Nové Mesto, Rača, Dúbravka, Karlova Ves, etc.). Reject only completely boring bureaucratic notices, obscure tenders, or stories outside Bratislava."
min_score: 3  # 1 to 10 threshold required to post (3+ = any interesting Bratislava news/events/incidents, 1-2 = very boring bureaucracy, 0 = not in Bratislava)

# 2. Output and Style
output:
  target_language: "Ukrainian"
  style_guide: >
    Інформативний, стриманий, але простий і зрозумілий стиль міських новин для пересічного читача (без «жовтизни», сарказму чи спаму емодзі).
    Вимоги до формату:
    1. Заголовок: чіткий, влучний, виділений жирним шрифтом (<b>...</b>). Дозволено використати МАКСИМУМ 1 доречний емодзі (наприклад: 📍, 🏛️, 🚗, ⚠️) на початку заголовка або взагалі без емодзі.
    2. Текст: 2-3 лаконічні речення, які просто і доступно пояснюють суть події: що сталося, де саме і які наслідки чи деталі важливі для жителів.
    3. Локація: обов'язково вказувати точне місце у Братиславі природною українською мовою (наприклад, «У Братиславі на вулиці...», «У Петржалці...», «У Ружинові...», «У Старому місті...»).
    4. ПРАВИЛО ЕМОДЗІ: Суворо НЕ БІЛЬШЕ 1 емодзі на всю публікацію! Жодного нагромадження смайликів чи треш-емодзі (ніяких 🤡, 🤦‍♂️, 🍻 тощо).
    5. ФАКТЧЕКІНГ: Суворо 100% відповідність фактам із першоджерела. Жодних вигадок, домислів чи перебільшень. Тільки реальні факти.
    6. ЛОКАЦІЙНЕ ПРАВИЛО: Публікації виключно про Братиславу та її райони.
    7. Використовуйте чистий HTML: <b>жирний</b>, <i>курсив</i> та <a href="...">посилання</a>. Не використовуйте markdown.
  max_caption_length: 900  # Stays safely under Telegram's 1024-character photo caption limit
  include_source_link: false  # Do NOT mention original news source
  channel_name: "Братислава"
  channel_link: "https://t.me/bratislavanewss"

# 3. AI Model Settings
ai:
  provider: "gemini"
  model: "gemini-3.5-flash-lite"  # Fast, highly available model on free tier
  temperature: 0.2           # Low temperature for factual accuracy
  batch_size: 10             # Evaluates up to 10 articles per prompt to stay within 15 RPM limits
  vision_check: true         # AI inspects candidate photos: rejects watermarks/outlet logos, stock and irrelevant images

# 4. News Sources
# type: "rss" (RSS/Atom feed, default) or "sitemap" (Google News sitemap: every article of the last ~48h with exact times)
# dedicated: true = the source only covers Bratislava, so the keyword pre-filter is skipped
sources:
  # --- Bratislava-only outlets ---
  - name: "Bratislavak"
    url: "https://www.bratislavak.sk/sitemap_news.xml"
    type: sitemap
    dedicated: true
  - name: "BratislavaDeň"
    url: "https://bratislavaden.sk/feed/"
    dedicated: true
  - name: "Bratislava Zoznam"
    url: "https://bratislava.zoznam.sk/feed/"
    dedicated: true
  - name: "Bratislavský Kraj"
    url: "https://bratislavskykraj.sk/feed/"
    dedicated: true
  - name: "Denník N Bratislava"
    url: "https://dennikn.sk/tema/bratislava/rss/"
    dedicated: true
    enabled: false  # Nearly every article is paywalled (schema.org isAccessibleForFree=false)

  # --- National wires and dailies (keyword pre-filter + AI location check) ---
  - name: "Teraz Wire"
    url: "https://www.teraz.sk/rss/vsetky-spravy.rss"
  - name: "Teraz Regióny"
    url: "https://www.teraz.sk/rss/regiony.rss"
  - name: "SITA"
    url: "https://sita.sk/app/plugins/sitemap-generator/google-news.php"
    type: sitemap
  - name: "Nový Čas"
    url: "https://www.cas.sk/google_news.xml"
    type: sitemap
  - name: "Plus JEDEN DEŇ"
    url: "https://www1.pluska.sk/google_news.xml"
    type: sitemap
  - name: "Pravda Krimi"
    url: "https://spravy.pravda.sk/krimi/rss/xml/"
  - name: "Pravda Regióny"
    url: "https://spravy.pravda.sk/regiony/rss/xml/"
  - name: "Pravda Správy"
    url: "https://spravy.pravda.sk/domace/rss/xml/"
  - name: "Aktuality"
    url: "https://www.aktuality.sk/rss/"
  - name: "Aktuality Domáce"
    url: "https://www.aktuality.sk/rss/domace/"
  - name: "Aktuality Krimi"
    url: "https://www.aktuality.sk/rss/krimi/"
  - name: "Topky Domáce"
    url: "https://www.topky.sk/rss/10/Spravy_-_Domace.rss"
  - name: "STVR Regióny"
    url: "https://spravy.stvr.sk/kategoria/regiony/feed/"
  - name: "HN Online"
    url: "https://www.hnonline.sk/feed"
  - name: "Startitup"
    url: "https://www.startitup.sk/feed/"
  - name: "Refresher SK"
    url: "https://refresher.sk/sitemap/news.xml"
    type: sitemap
  - name: "Pravda Ekonomika"
    url: "https://spravy.pravda.sk/ekonomika/rss/xml/"
    enabled: false  # Rarely Bratislava-specific
  # Removed: TV Noviny (feed returns 404), SME Bratislava (blocks bots), RTVS Regióny (moved to STVR)

# 5. Pipeline Tuning
settings:
  max_articles_per_run: 50    # Maximum total new articles to evaluate per run
  max_posts_per_run: 1        # Optimal pacing: 1 top story per run (e.g. 1 per hour)
  max_article_age_hours: 12   # Only stories published within the last 12 hours are considered
  max_images_per_post: 4      # Multi-image album support (sends up to 4 high-res photos via sendMediaGroup)
  max_image_candidates: 5     # Photos per story shown to the AI vision check (watermarks, logos, relevance)
  require_image: true         # Only post articles that have an image (no plain text posts)
  min_image_width: 600        # Minimum image width in pixels for high quality posts
  min_image_height: 350       # Minimum image height in pixels
  history_retention_days: 14  # Auto-prune state entries older than 14 days
  max_post_attempts: 3        # Give up on a story after this many failed generation/posting attempts
  post_delay_seconds: 3       # Sleep between Telegram posts to respect rate limits
  request_timeout_seconds: 15 # Network timeout for scraping and requests
  min_minutes_between_posts: 20        # Daytime spacing between posts so the channel isn't flooded
  min_minutes_between_posts_night: 60  # Night spacing (within quiet_hours)
  breaking_score: 8           # Stories scoring >= this are posted immediately, ignoring the spacing
  quiet_hours: "23-7"         # Night window (local time): silent posts, slower checks, wider spacing
  poll_minutes_day: 15        # --loop mode: check sources every 15 min during the day...
  poll_minutes_night: 45      # ...and every 45 min at night
  poll_backoff_max: 2.0       # When checks find nothing new, the pause grows up to 2x (30 min day / 90 min night)
