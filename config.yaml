# ==============================================================================
# Universal News Bot Configuration
# ==============================================================================
# This configuration defines which country to monitor, what type of news to find,
# how to filter and score them, and how to format the output for Telegram.
# To adapt this bot for another country or style, simply adjust the values below!

# 1. Target Region and Topic
country: "Slovakia"
target_city: "Bratislava"
source_language: "Slovak"
content_theme: "interesting, engaging, notable, or fresh local news, events, festivals, accidents, transport, city life, crime blotters, weather warnings, culture, and happenings occurring EXCLUSIVELY in BRATISLAVA (and Bratislava boroughs: Petržalka, Ružinov, Staré Mesto, Nové Mesto, Rača, Dúbravka, Karlova Ves, etc.). Reject only completely boring bureaucratic notices, obscure tenders, or stories outside Bratislava."
min_score: 3  # 1 to 10 threshold required to post (3+ = any interesting Bratislava news/events/incidents, 1-2 = very boring bureaucracy, 0 = not in Bratislava)

# 2. Output and Style
output:
  target_language: "Ukrainian"
  style_guide: >
    Інформативний, стриманий, але простий і зрозумілий стиль міських новин для пересічного читача (без «жовтизни», сарказму чи спаму емодзі).
    Вимоги до формату:
    1. Заголовок: чіткий, влучний, виділений жирним шрифтом (<b>...</b>). Дозволено використати МАКСИМУМ 1 доречний емодзі (наприклад: 📍, 🏛️, 🚗, ⚠️) на початку заголовка або взагалі без емодзі.
    2. Текст: 2-3 лаконічні речення, які просто і доступно пояснюють суть події: що сталося, де саме і які наслідки чи деталі важливі для жителів.
    3. Локація: обов'язково вказувати точне місце у Братиславі природною українською мовою (наприклад, «У Братиславі на вулиці...», «У Петржалці...», «У Ружинові...», «У Старому місті...»).
    4. ПРАВИЛО ЕМОДЗІ: Суворо НЕ БІЛЬШЕ 1 емодзі на всю публікацію! Жодного нагромадження смайликів чи треш-емодзі (ніяких 🤡, 🤦‍♂️, 🍻 тощо).
    5. ФАКТЧЕКІНГ: Суворо 100% відповідність фактам із першоджерела. Жодних вигадок, домислів чи перебільшень. Тільки реальні факти.
    6. ЛОКАЦІЙНЕ ПРАВИЛО: Публікації виключно про Братиславу та її райони.
    7. Використовуйте чистий HTML: <b>жирний</b>, <i>курсив</i> та <a href="...">посилання</a>. Не використовуйте markdown.
  max_caption_length: 900  # Stays safely under Telegram's 1024-character photo caption limit
  include_source_link: false  # Do NOT mention original news source
  channel_name: "Братислава"
  channel_link: "https://t.me/bratislavanewss"

# 3. AI Model Settings
ai:
  provider: "gemini"
  model: "gemini-3.5-flash-lite"  # Fast, highly available model on free tier
  temperature: 0.2           # Low temperature for factual accuracy
  batch_size: 10             # Evaluates up to 10 articles per prompt to stay within 15 RPM limits

# 4. RSS Feed Sources (Bratislava-focused + National/Regional feeds)
sources:
  - name: "Bratislavský Kraj"
    rss_url: "https://bratislavskykraj.sk/feed/"
    enabled: true
  - name: "Pravda Regióny"
    rss_url: "https://spravy.pravda.sk/regiony/rss/xml/"
    enabled: true
  - name: "Teraz Regióny"
    rss_url: "https://www.teraz.sk/rss/regiony.rss"
    enabled: true
  - name: "Topky Domáce"
    rss_url: "https://www.topky.sk/rss/10/Spravy_-_Domace.rss"
    enabled: true
  - name: "Aktuality"
    rss_url: "https://www.aktuality.sk/rss/"
    enabled: true
  - name: "Pravda Správy"
    rss_url: "https://spravy.pravda.sk/domace/rss/xml/"
    enabled: true
  - name: "SME Bratislava"
    rss_url: "https://bratislava.sme.sk/rss-title"
    enabled: false

# 5. Pipeline Tuning
settings:
  max_articles_per_run: 30    # Maximum total new articles to evaluate per run
  max_posts_per_run: 1        # Optimal pacing: 1 top story per run (e.g. 1 per hour)
  require_image: true         # Only post articles that have an image (no plain text posts)
  min_image_width: 600        # Minimum image width in pixels for high quality posts
  min_image_height: 350       # Minimum image height in pixels
  history_retention_days: 14  # Auto-prune state entries older than 14 days
  post_delay_seconds: 3       # Sleep between Telegram posts to respect rate limits
  request_timeout_seconds: 15 # Network timeout for scraping and requests
