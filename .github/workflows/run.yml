name: News Ingestion & Telegram Bot

on:
  schedule:
    # Runs every 45 minutes
    - cron: '*/45 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

concurrency:
  group: news-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run news pipeline
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python main.py

      - name: Commit and push updated seen_urls.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_urls.json
          if ! git diff --staged --quiet; then
            echo "State changes detected. Committing and pushing..."
            git commit -m "chore: update state [skip ci]"
            git pull --rebase
            git push
          else
            echo "No state changes to commit."
          fi
