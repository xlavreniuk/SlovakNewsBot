name: News Ingestion & Telegram Bot

on:
  schedule:
    # Each run keeps checking sources for ~5h40m (see --loop below): every 15 min by day,
    # 45 min at night, longer when nothing new appears (settings in config.yaml).
    # Hourly attempts (at an off-peak minute, which GitHub throttles less) keep one run queued
    # behind the active one, so a new poller starts as soon as the previous one finishes.
    - cron: '17 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

concurrency:
  group: news-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-24.04
    timeout-minutes: 358

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure git for state pushes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run news pipeline (polling loop)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        # 340 minutes of polling leaves headroom under the 360-minute job limit
        run: |
          python main.py --loop 340 --push-state

      - name: Commit and push updated seen_urls.json
        if: always()
        run: |
          git add seen_urls.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: update state [skip ci]"
            for i in 1 2 3; do
              git pull --rebase origin main && git push origin HEAD:main && break || sleep 5
            done
          else
            echo "No state changes to commit."
          fi
